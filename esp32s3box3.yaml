          std::vector<std::string> lines;
          std::string current_line;
          for (const char* p = text; *p != '\0'; ++p) {
            if (current_line.length() >= max_chars_per_line || *p == '\n') {
              lines.push_back(current_line);
              current_line.clear();
              if (*p != '\n') current_line += *p;
            } else {
              current_line += *p;
            }
          }
          if (!current_line.empty()) lines.push_back(current_line);
          int total_height = lines.size() * line_height;
          y = (display_height - total_height) / 2;
          for (const auto& line : lines) {
            int line_width = line.length() * 21;
            int x = (display_width - line_width) / 2;
            it.printf(x, y, id(my_font4), id(ha_blue), TextAlign::BASELINE_LEFT, "%s", line.c_str());
            y += line_height;
          }
          it.filled_rectangle(0, 220, 320, 20, id(ha_blue));
          it.printf(160, 223, id(my_font12), id(white), TextAlign::TOP_CENTER, "Sound Healing Assistant by Captain Leopard");
i2c:
  - id: bus_a
    sda: GPIO08
    scl: GPIO18
    scan: true
    sda_pullup_enabled: true
    scl_pullup_enabled: true
    frequency: 100kHz
  - sda: GPIO41
    scl: GPIO40
    scan: true
    sda_pullup_enabled: true
    scl_pullup_enabled: true
    frequency: 50kHz
    id: bus_b

touchscreen:
  - platform: gt911
    i2c_id: bus_a
    address: 0x5D
    id: gt911_touchscreen
    interrupt_pin:
      number: GPIO3
      ignore_strapping_warning: true
    on_touch:
      - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
    on_release:
      - script.execute: saver_enabled

binary_sensor:
  # ── Boot button (GPIO0): toggle chakra mode ──
  - platform: gpio
    id: top_left_button
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    on_press:
      - if:
          condition:
            - display.is_displaying_page: saver_page
          then:
            - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
            - display.page.show: idle_page
            - script.execute: saver_enabled
            - component.update: s3_box_lcd
          else:
            - if:
