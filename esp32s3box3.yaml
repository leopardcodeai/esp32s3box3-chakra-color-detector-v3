    type: bool
    restore_value: false
  - id: global_first_timer
    type: voice_assistant::Timer
    restore_value: false
  - id: global_is_timer
    type: bool
    restore_value: false
  - id: global_is_assisting
    type: bool
    restore_value: false
  - id: previous_notification_text
    type: std::string
    initial_value: ""

number:
  - id: s_saver_delay
    platform: template
    name: "Scr/save delay"
    icon: 'mdi:sleep'
    entity_category: config
    unit_of_measurement: 'secs'
    optimistic: true
    restore_value: true
    initial_value: 120
    step: 5
    min_value: 10
    max_value: 999999
    on_value:
      - component.update: s3_box_lcd
      - component.update: s_saver_delay
      - script.execute: saver_enabled

  - id: s_saver_blank_delay
    platform: template
    name: "Scr/off delay"
    icon: 'mdi:monitor-off'
    entity_category: config
    unit_of_measurement: 'secs'
    optimistic: true
    restore_value: true
    initial_value: 120
    step: 5
    min_value: 10
    max_value: 999999
    on_value:
      - component.update: s_saver_blank_delay
      - script.execute: saver_enabled
      - component.update: s3_box_lcd

  - id: s_saver_brightness
    platform: template
    name: "Scr/save Brightness"
    icon: 'mdi:sleep'
    entity_category: config
    unit_of_measurement: '%'
    optimistic: true
    restore_value: true
    initial_value: ${saver_brightness}
    step: 5
    min_value: 20
    max_value: 100
    on_value:
      - component.update: s_saver_brightness
      - script.execute: saver_enabled
      - component.update: s3_box_lcd

  - id: s_default_brightness
    platform: template
    name: "Default Brightness"
    icon: 'mdi:monitor'
    entity_category: config
    unit_of_measurement: '%'
    optimistic: true
    restore_value: true
    initial_value: ${default_brightness}
    step: 5
    min_value: 20
    max_value: 100
    on_value:
      - component.update: s_default_brightness
      - script.execute: saver_enabled
      - component.update: s3_box_lcd

  - id: temp_offset
    platform: template
    name: "Temperature Offset"
    icon: 'mdi:thermometer-plus'
    entity_category: config
    unit_of_measurement: '°C'
    optimistic: true
    restore_value: true
    initial_value: -10
    step: 0.5
    min_value: -20
    max_value: 20
    on_value:
      - component.update: s3_box_lcd
button:
  - platform: restart
    id: reboot
    name: "Reboot"
    entity_category: diagnostic

switch:
  # ─── Chakra Mode Switch ──────────────────────────────────────
  - platform: template
    name: Chakra Mode
    id: chakra_mode_switch
    icon: mdi:sine-wave
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      # 0. Guard: mark transition in progress
      - lambda: id(chakra_transitioning) = true;
      # 1. Stop VA + wake-word first — they own box_mic
      - script.execute: stop_voice_assistant
      # 2. Fixed delay: let I2S fully release
      - delay: 800ms
      # 3. Now safe to take the mic for chakra
      - lambda: |-
          id(chakra_mode_active) = true;
          id(box_mic)->start();
          id(chakra_transitioning) = false;
      - if:
          condition:
            lambda: 'return id(s3_box_lcd).get_active_page() != id(chakra_page);'
          then:
            - display.page.show: chakra_page
            - component.update: s3_box_lcd
    on_turn_off:
      # 0. Guard: mark transition in progress
      - lambda: id(chakra_transitioning) = true;
      # 1. Clear guard flag so on_data callbacks bail out
      - lambda: |-
          id(chakra_mode_active) = false;
          id(chakra_index) = -1;
          id(chakra_active_name).publish_state("None");
          id(chakra_active_color).publish_state("#FFFFFF");
      # 2. Let any in-flight on_data callback finish, then release mic
      - delay: 100ms
      - lambda: id(box_mic)->stop();
      - delay: 500ms
      - lambda: id(chakra_transitioning) = false;
      - script.execute: start_voice_assistant
  # ─── End Chakra Mode Switch ──────────────────────────────────
  - platform: gpio
    name: Speaker Enable
    id: speaker_enable
    pin: 
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_OFF
    entity_category: config
    disabled_by_default: true

  - platform: template
    name: Display conversation
    id: display_conversation
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    icon: 'mdi:chat'

  - platform: template
    name: Output audio externally
    id: output_audio
    icon: 'mdi:volume-off'
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      media_player.volume_set:
        id: speaker_media_player
        volume: 0
    on_turn_off:
      media_player.volume_set:
        id: speaker_media_player
        volume: 1.0

  - platform: template
    name: Mute
    id: mute_switch
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      then:
        - voice_assistant.stop
        - micro_wake_word.stop
    on_turn_off:
      - if:
          condition:
            not:
              - voice_assistant.is_running
          then:
            - if:
                condition:
                  lambda: return id(wake_word_engine_location).state == "In Home Assistant";
                then:
                  - lambda: id(va).set_use_wake_word(true);
                  - delay: 50ms
                  - voice_assistant.start_continuous
            - if:
                condition:
                  lambda: return id(wake_word_engine_location).state == "On device";
                then:
                  - lambda: id(va).set_use_wake_word(false);
                  - micro_wake_word.start
            - component.update: s3_box_lcd

  - platform: template
    id: media_mute
    optimistic: true
    on_turn_on:
      media_player.volume_set:
        id: speaker_media_player
        volume: 0
    on_turn_off:
      media_player.volume_set:
        id: speaker_media_player
        volume: 1.0

  - platform: template
    id: s_saver
    name: Scr/save enable
    icon: mdi:sleep
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

  - platform: template
    id: s_saver_mode
    name: Scr/off enable
    icon: 'mdi:monitor-off'
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

  - platform: template # remove for no sensor version
    id: s_saver_presc
    name: Screen wake on motion
    icon: 'mdi:motion-sensor'
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF

    on_turn_off:
      # Turn off the repeat mode and disable the pause between playlist items
      - lambda: |-
              id(speaker_media_player)
                ->make_call()
                .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_OFF)
                .set_announcement(true)
                .perform();
              id(speaker_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 0);
      # Stop playing the alarm
      - media_player.stop:
          announcement: true
      - if:
          condition:
            lambda: return id(wake_word_engine_location).state == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start
          else:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start
    on_turn_on:
      - lambda: id(va).set_use_wake_word(false);
      - voice_assistant.stop:
      - micro_wake_word.stop:
      - delay: 150ms
      # Turn on the repeat mode and pause for 1000 ms between playlist items/repeats
      - lambda: id(led).turn_on().set_brightness(1.0).perform();
      - lambda: |-
            id(speaker_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_ONE)
              .set_announcement(true)
              .perform();
            id(speaker_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 1000);
      - media_player.speaker.play_on_device_media_file:
          media_file: timer_finished_sound
          announcement: true
      - delay: 15min
      - switch.turn_off: timer_ringing

  - platform: template
    id: wake_sound
    name: Play wake sound
    icon: mdi:music
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: mute_response_switch
    name: Mute Responses
    icon: mdi:chat-sleep
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: ext_media_mute
    icon: 'mdi:volume-off'
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      then:
        - homeassistant.service:
            service: media_player.volume_mute
            data:
              entity_id: media_player.${external_media_player}
    on_turn_off:
      - homeassistant.service:
          service: media_player.volume_mute
          data:
            entity_id: media_player.${external_media_player}

output:
  - platform: ledc
    pin: GPIO47
    id: backlight_output

light:
  - platform: monochromatic
    id: led
    name: LCD Backlight
    entity_category: config
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 50ms

sensor:
  - platform: aht10 # remove for no sensor version
    i2c_id: bus_b
    variant: AHT20
    temperature:
      name: "S3 Temperature"
      id: s3temp
      accuracy_decimals: 1
      filters:
        - lambda: return x + id(temp_offset).state;
        - round: 1
    humidity:
      name: "S3 Humidity"
      id: s3humidity
      accuracy_decimals: 1
      filters:
        - round: 1
    update_interval: 60s

  - platform: adc # remove for no sensor version
    pin: GPIO10
    id: battery_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: "voltage"
    entity_category: "diagnostic"
    disabled_by_default: true
    update_interval: 30s
    attenuation: auto
    filters:
      - multiply: 4.11

  - platform: copy # remove for no sensor version
    id: battery_percent
    source_id: battery_voltage
    name: "Battery level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: "battery"
    entity_category: "diagnostic"
    filters:
      - lambda: return (x - 2.7) / (4.2 - 2.7) * 100;
      - clamp:
          min_value: 0
          max_value: 100

  - platform: uptime
    id: up_sens
    on_value:
      - lambda: |-
          int seconds = id(up_sens).state;
          int days = seconds / 86400;
          int hours = seconds / 3600;
          int minutes = (seconds % 3600) / 60;
          seconds %= 60;
          id(up_sens_text).publish_state(str_sprintf("%03d:%02d:%02d:%02d", days, hours, minutes, seconds));
    update_interval: 30s

  - platform: wifi_signal
    name: "WiFi db"
    id: wifi_signal_db
    update_interval: 30s

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal"
    id: wifi_percent
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""

text_sensor:
  # ─── Chakra text sensors ──────────────────────────────────────
  - platform: template
    id: chakra_active_name
    name: Chakra Name
    icon: mdi:circle-outline
  - platform: template
    id: chakra_active_color
    name: Chakra Color
    icon: mdi:palette
  # ─── End Chakra text sensors ──────────────────────────────────
  - id: text_request
    platform: template
    on_value:
      lambda: |-
        if(id(text_request).state.length()>32) {
          std::string name = id(text_request).state.c_str();
          std::string truncated = esphome::str_truncate(name.c_str(),31);
          id(text_request).state = (truncated+"...").c_str();
        }

  - id: text_response
    platform: template
    on_value:
      lambda: |-
        if(id(text_response).state.length()>32) {
          std::string name = id(text_response).state.c_str();
          std::string truncated = esphome::str_truncate(name.c_str(),31);
          id(text_response).state = (truncated+"...").c_str();
        }
  - platform: wifi_info
    ip_address:
      name: IP Address
      id: ip_addr
      entity_category: "diagnostic"
    ssid:
      id: connected_ssid
      name: SSID
      entity_category: "diagnostic"
    bssid:
      id: connected_bssid
      name: BSSID
      entity_category: "diagnostic"
    mac_address:
      id: device_mac

  - platform: template
    id: up_sens_text
    name: Device uptime
    entity_category: "diagnostic"
    icon: mdi:clock

  - platform: template
    id: wakeword_location

  - platform: template
    id: time_remaining_0
    name: Timer
    icon: mdi:clock

  - platform: template
    id: time_remaining_1

  - platform: template
    id: time_display_format
    update_interval: never
  - platform: homeassistant
    entity_id: media_player.${external_media_player}
    id: ha_media_status
    on_value:
      component.update: s3_box_lcd

  - platform: homeassistant
    entity_id: media_player.${external_media_player}
    id: ha_media_title
    attribute: media_content_id
    on_value:
      component.update: s3_box_lcd

  - platform: homeassistant
    id: ha_light_entity_state
    entity_id: light.${chakra_light_entity}
    on_value:
      - component.update: s3_box_lcd

  - platform: homeassistant
    id: ha_light_rgb_color
    entity_id: light.${chakra_light_entity}
    attribute: rgb_color
    on_value:
      then:
        - lambda: |-
            std::string s = x;
            int r = 0, g = 0, b = 0;
            if (sscanf(s.c_str(), "(%d, %d, %d)", &r, &g, &b) == 3 ||
                sscanf(s.c_str(), "[%d, %d, %d]", &r, &g, &b) == 3) {
              id(chakra_ha_r) = r;
              id(chakra_ha_g) = g;
              id(chakra_ha_b) = b;
            }
        - component.update: s3_box_lcd

text:
  - platform: template
    name: "Notification Text"
    id: notification_text
    mode: text
    optimistic: true
    on_value:
      then:
        - lambda: |-
            if (!id(notification_text).state.empty() && 
                (id(previous_notification_text).empty() || id(notification_text).state != id(previous_notification_text))) {
              id(previous_notification_text) = id(notification_text).state;
              id(show_notification).execute();
            }
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin:
      number: GPIO45
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO2

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_a
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 24dB

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    bits_per_sample: 16bit
    sample_rate: 48000

microphone:
  - platform: i2s_audio
    id: box_mic
    sample_rate: 16000
    i2s_din_pin: GPIO16
    bits_per_sample: 16bit
    adc_type: external
    on_data:
      - lambda: |-
          if (!id(chakra_mode_active)) return;
          const int16_t* samples = reinterpret_cast<const int16_t*>(x.data());
          size_t sample_count = x.size() / 2;
          // Always update fill progress (runs even between FFT frames)
          id(fft_accum_fill) = ChakraAnalyser::accum_fill;
          if (ChakraAnalyser::push_samples(samples, sample_count,
                                           id(chakra_detection_threshold))) {
            // ── Hold/stability logic ─────────────────────────────────────
            // When currently showing NO chakra (-1): accept detection after confirm_req frames.
            // When currently showing A chakra: hold for hold_req frames before switching.
            // This avoids delaying initial detection while still preventing rapid switching.
            int new_chakra = ChakraAnalyser::dominant_chakra;
            int hold_req = id(chakra_hold_frames);
            int confirm_req = hold_req / 4;
            if (confirm_req < 1) confirm_req = 1;
            if (id(chakra_index) < 0) {
                // Currently showing no chakra — accept first confirmed detection immediately
                if (new_chakra >= 0) {
                    if (new_chakra == id(chakra_candidate)) {
                        id(chakra_candidate_count) += 1;
                        if (id(chakra_candidate_count) >= 1) {  // instant: 1 frame confirms
                            id(chakra_index) = new_chakra;
                            id(chakra_hold_counter) = hold_req;
                            id(chakra_candidate) = -2;
                            id(chakra_candidate_count) = 0;
                        }
                    } else {
                        id(chakra_candidate) = new_chakra;
                        id(chakra_candidate_count) = 1;
                    }
                }
                // new_chakra=-1 while already -1: nothing to do
            } else {
                // Currently showing a chakra — hold it unless something else confirmed
                if (new_chakra == id(chakra_index)) {
                    // Same chakra still detected — refresh hold timer
                    id(chakra_hold_counter) = hold_req;
                    id(chakra_candidate) = -2;
                    id(chakra_candidate_count) = 0;
                } else {
                    // Different result — count down hold timer first
                    if (id(chakra_hold_counter) > 0) id(chakra_hold_counter) -= 1;
                    if (id(chakra_hold_counter) <= 0) {
                        // Hold expired — evaluate candidate
                        if (new_chakra == id(chakra_candidate)) {
                            id(chakra_candidate_count) += 1;
                            if (id(chakra_candidate_count) >= confirm_req) {
                                id(chakra_index) = new_chakra;
                                id(chakra_hold_counter) = (new_chakra >= 0) ? hold_req : 0;
                                id(chakra_candidate) = -2;
                                id(chakra_candidate_count) = 0;
                            }
                        } else {
                            id(chakra_candidate) = new_chakra;
                            id(chakra_candidate_count) = 1;
                        }
                    }
                }
            }
            id(peak_freq_hz)    = ChakraAnalyser::peak_frequency;
            id(signal_level_db) = ChakraAnalyser::signal_db;
            id(fft_accum_fill)  = 1024;
            id(fft_bar_0)  = ChakraAnalyser::bar_magnitudes[0];
            id(fft_bar_1)  = ChakraAnalyser::bar_magnitudes[1];
            id(fft_bar_2)  = ChakraAnalyser::bar_magnitudes[2];
            id(fft_bar_3)  = ChakraAnalyser::bar_magnitudes[3];
            id(fft_bar_4)  = ChakraAnalyser::bar_magnitudes[4];
            id(fft_bar_5)  = ChakraAnalyser::bar_magnitudes[5];
            id(fft_bar_6)  = ChakraAnalyser::bar_magnitudes[6];
            id(fft_bar_7)  = ChakraAnalyser::bar_magnitudes[7];
            id(fft_bar_8)  = ChakraAnalyser::bar_magnitudes[8];
            id(fft_bar_9)  = ChakraAnalyser::bar_magnitudes[9];
            id(fft_bar_10) = ChakraAnalyser::bar_magnitudes[10];
            id(fft_bar_11) = ChakraAnalyser::bar_magnitudes[11];
            id(fft_bar_12) = ChakraAnalyser::bar_magnitudes[12];
            id(fft_bar_13) = ChakraAnalyser::bar_magnitudes[13];
            id(fft_bar_14) = ChakraAnalyser::bar_magnitudes[14];
            id(fft_bar_15) = ChakraAnalyser::bar_magnitudes[15];
            id(chakra_fft_ready) = true;  // signal main loop: new data ready
          }

speaker:
  - id: i2s_audio_speaker
    platform: i2s_audio
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO15
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: left
    audio_dac: es8311_dac
    buffer_duration: 500ms  # Increased for stability without timeout @youkorr
  # Virtual speakers to combine the announcement and media streams together into one output
  - id: mixing_speaker
    platform: mixer
    output_speaker: i2s_audio_speaker
    source_speakers:
      - id: announcement_mixing_input
      - id: media_mixing_input
  # Vritual speakers to resample each pipelines' audio, if necessary, as the mixer speaker requires the same sample rate
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000  # Added explicit sample rate
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000  # Added explicit sample rate

media_player:
  - platform: speaker
    name: Media Player
    id: speaker_media_player
    disabled_by_default: true
    volume_increment: 0.05
    volume_min: 0.5
    volume_max: 0.8
    task_stack_in_psram: true
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1  # S3 Box only has one output channel
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC  # FLAC is the least processor intensive codec
      num_channels: 2
      sample_rate: 48000
    files:
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
      - id: wake_sound_file
        file: https://github.com/BigBobbas/ESP32-S3-Box3-Custom-ESPHome/raw/main/sounds/awake.flac
    on_state:
      then:
        - if:
            condition:
              media_player.is_playing:
            then:
              - micro_wake_word.stop
              - voice_assistant.stop
        - if:
            condition:
              and:
                - lambda: return id(global_is_assisting) == false;
                - or:
                    - media_player.is_idle
                    - media_player.is_paused
            then:
              - if:
                  condition:
                    and:
                      - switch.is_off: mute_switch
                      - lambda: return id(wake_word_engine_location).state == "On device";
                  then:
                    - micro_wake_word.start
                  else:
                    - if:
                        condition:
                          - switch.is_off: mute_switch
                        then:
                          - voice_assistant.start
        - if:
            condition:
              and:
                - switch.is_off: timer_ringing
                - not:
                    voice_assistant.is_running:
                - not:
                    media_player.is_announcing:
            then:
              - mixer_speaker.apply_ducking:
                  id: media_mixing_input
                  decibel_reduction: 0
                  duration: 1.0s
    on_play:
      - wait_until:
          - lambda: return id(global_is_assisting) == false;
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s

micro_wake_word:
  vad:
  models:
    #- model: ${micro_wake_word_model_1}
    # - model: ${micro_wake_word_model_2}
    - model: ${micro_wake_word_model_3}
    # - model: ${micro_wake_word_model_4}
  on_wake_word_detected:
    - lambda: id(global_is_assisting) = true;
    - delay: 50ms
    - if:
        condition:
          and:
            - switch.is_off: output_audio
            - switch.is_on: wake_sound
        then:
          - media_player.speaker.play_on_device_media_file:
              media_file: wake_sound_file
              announcement: true
          - wait_until:
              not:
                - media_player.is_announcing:
          - delay: 150ms
        else:
          if:
            condition:
              and:
                - switch.is_on: output_audio
                - switch.is_on: wake_sound
            then:
              - homeassistant.service:
                  service: media_player.play_media
                  data:
                    entity_id: media_player.${external_media_player}
                    media_content_id: '${home_assistant_host}/local/sounds/awake.mp3'
                    media_content_type: music
    - display.page.show: listening_page
    - component.update: s3_box_lcd
    - delay: 100ms
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: box_mic
  media_player: speaker_media_player
  use_wake_word: true
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 4.0
  on_wake_word_detected:
    - lambda: id(global_is_assisting) = true;
    - voice_assistant.stop:
    - lambda: id(va).set_use_wake_word(false);
    - if:
        condition:
          and:
            - switch.is_off: output_audio
            - switch.is_on: wake_sound
        then:
          # - voice_assistant.stop:
          # - delay: 150ms
          # - if:
              # condition:
                # not:
                  # microphone.is_capturing:
              # then:
          - media_player.speaker.play_on_device_media_file:
              media_file: wake_sound_file
              announcement: true
          - wait_until:
              not:
                - media_player.is_announcing:
          - delay: 150ms
          - lambda: id(va).set_use_wake_word(false);
          - display.page.show: listening_page
          - component.update: s3_box_lcd
        else:
          if:
            condition:
              and:
                - switch.is_on: wake_sound
                - switch.is_on: output_audio
            then:
              - homeassistant.service:
                  service: media_player.play_media
                  data:
                    entity_id: media_player.${external_media_player}
                    media_content_id: '${home_assistant_host}/local/sounds/awake.mp3'
                    media_content_type: music
    - voice_assistant.start
  on_start:
    if:
      condition:
        - display.is_displaying_page: listening_page
        - display.is_displaying_page: thinking_page
      then:
        - display.page.show: idle_page
        - component.update: s3_box_lcd
  on_listening:
    - text_sensor.template.publish:
        id: text_request
        state: "..."
    - text_sensor.template.publish:
        id: text_response
        state: "..."
    - script.execute: saver_enabled
    - display.page.show: listening_page
    - component.update: s3_box_lcd
  on_stt_end:
    - text_sensor.template.publish:
        id: text_request
        state: !lambda return x;
  on_stt_vad_end:
    - display.page.show: thinking_page
    - component.update: s3_box_lcd
  on_tts_start:
    - text_sensor.template.publish:
        id: text_response
        state: !lambda return x;
  on_tts_end:
    - if:
        condition:
          and:
            - switch.is_on: mute_response_switch
            - switch.is_off: media_mute
            - switch.is_off: ext_media_mute
        then:
          - switch.turn_on: media_mute
          - switch.turn_on: ext_media_mute
    - display.page.show: replying_page
    - component.update: s3_box_lcd
    - if:
        condition:
          - switch.is_on: output_audio
        then:
          - homeassistant.service:
              service: media_player.play_media
              data:
                entity_id: media_player.${external_media_player}
                media_content_id: !lambda 'return x;'
                media_content_type: music
                announce: "false"
    - delay: 5s
    - display.page.show: idle_page
    - component.update: s3_box_lcd

  on_error:
    - if:
        condition:
          not:
            - voice_assistant.is_running
        then:
          - display.page.show: error_page
          - component.update: s3_box_lcd
          - delay: 4s
          - if:
              condition:
                - display.is_displaying_page: error_page
              then:
                - display.page.show: idle_page
                - component.update: s3_box_lcd
    - lambda: id(global_is_assisting) = false;

  on_idle:
    - if:
        condition:
          lambda: return !id(chakra_mode_active);
        then:
          - display.page.show: idle_page
          - component.update: s3_box_lcd

  on_end:
    - if:
        condition:
          lambda: return id(chakra_mode_active);
        then:
          - lambda: id(global_is_assisting) = false;
        else:
          - wait_until:
              not:
                voice_assistant.is_running:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s
          - lambda: id(global_is_assisting) = false;
          - if:
              condition:
                and:
                  - switch.is_off: mute_switch
                  - lambda: return id(wake_word_engine_location).state == "On device";
              then:
                - voice_assistant.stop
                - micro_wake_word.start
              else:
                if:
                  condition:
                    - switch.is_off: mute_switch
                  then:
                    - lambda: id(va).set_use_wake_word(false);
                    - voice_assistant.stop:
                    - delay: 100ms
                    - lambda: id(va).set_use_wake_word(true);
                    - delay: 100ms
                    - voice_assistant.start_continuous:
    - if:
        condition:
          and:
            - switch.is_on: mute_response_switch
            - switch.is_on: media_mute
            - switch.is_on: ext_media_mute
        then:
          - switch.turn_off: media_mute
          - switch.turn_off: ext_media_mute

  on_client_connected:
    - if:
        condition:
          lambda: return !id(chakra_mode_active);
        then:
          - script.execute: start_voice_assistant
  on_timer_started:
    - script.execute: timer_ending
    - component.update: s3_box_lcd
  on_timer_cancelled:
    - lambda: id(time_remaining_0).publish_state ("0:00:00");
    - component.update: s3_box_lcd
  on_timer_updated:
    - component.update: s3_box_lcd
  on_timer_tick:
    - lambda: |-
        int seconds = timers[0].seconds_left;
        int hours = seconds / 3600;
        int minutes = (seconds % 3600) / 60;
        seconds %= 60;
        id(time_remaining_0).publish_state(str_sprintf("%d:%02d:%02d", hours, minutes, seconds));
    - component.update: s3_box_lcd
  on_timer_finished:
    if:
      condition:
        - switch.is_on: output_audio
      then:
        - switch.turn_on: timer_ringing
        - script.execute: timer_started_external
        - display.page.show: idle_page
        - component.update: s3_box_lcd
      else:
        - if:
            condition:
              - switch.is_off: output_audio
            then:
              - switch.turn_on: timer_ringing
              # - script.execute: timer_started
              - display.page.show: idle_page
              - component.update: s3_box_lcd



