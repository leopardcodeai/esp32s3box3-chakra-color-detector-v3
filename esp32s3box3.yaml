esphome:
  includes:
    - chakra_component.h
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.2.0
  on_boot:
    priority: 600
    then:
      - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
      - lambda: ChakraAnalyser::init();
      - display.page.show: loading_page
      - component.update: s3_box_lcd
      - script.execute: saver_enabled
      - lambda: id(time_remaining_0).publish_state ("0:00:00");
      - if:
          condition:
            switch.is_on: output_audio
          then:
            media_player.volume_set:
              id: speaker_media_player
              volume: 0
  project:
    name: "BigBobbas.s3box"
    version: "2024.09.02"
esp32:
  board: esp32s3box
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

api:
  on_client_connected:
    - lambda: |-
        id(api_connection) = true;
    - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
    - component.update: s3_box_lcd
    - script.execute: saver_enabled
  on_client_disconnected:
    - lambda: |-
        id(api_connection) = false;

ota:
  - platform: esphome
    on_begin:
      - lambda: id(led).turn_on().set_brightness(1.0).set_transition_length(0).perform();
                id(led).loop();
      - display.page.show: ota_page
      - component.update: s3_box_lcd

logger:
  hardware_uart: USB_SERIAL_JTAG
  logs:
    text_sensor: WARN
    component: ERROR

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}
    password: !secret ap_password
  on_connect:
    - lambda: |-
        id(wifi_connection) = true;
    - display.page.show: idle_page
    - component.update: s3_box_lcd
    - switch.turn_on: speaker_enable
  on_disconnect:
    - lambda: |-
        id(wifi_connection) = false;

captive_portal:
time:
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}

interval:
  - interval: 150ms
    # Chakra display + HA updates — runs on main loop (thread-safe with SPI/API)
    then:
      - lambda: |-
          if (!id(chakra_mode_active)) return;
          // Display refresh — always update so progress bars animate smoothly
          if (id(s3_box_lcd).get_active_page() == id(chakra_page))
            id(s3_box_lcd).update();
          // HA publish + light only when new FFT data is ready
          if (!id(chakra_fft_ready)) return;
          id(chakra_fft_ready) = false;
          int cidx = id(chakra_index);
          const ChakraInfo& ci = ChakraAnalyser::get_info(cidx);
          id(chakra_active_name).publish_state(ci.name);
          id(chakra_active_color).publish_state(ci.hex_color);
          if (cidx >= 0 && cidx != id(last_sent_chakra)) {
            id(last_sent_chakra) = cidx;
            id(chakra_send_to_ha).execute();
          }
          if (cidx < 0) id(last_sent_chakra) = -2;
  - interval: 30s
    then:
      - component.update: s3_box_lcd
  # Clock page refresh every second so time ticks
  - interval: 1s
    then:
      - lambda: |-
          if (id(s3_box_lcd).get_active_page() == id(clock_page) ||
              id(s3_box_lcd).get_active_page() == id(idle_page))
            id(s3_box_lcd).update();
  - interval: 10s
    then:
      - if:
          condition:
            - lambda: 'return { (id(api_connection) != true) };'
          then:
            - if:
                condition:
                  api.connected:
                then:
                  - lambda: "id(api_connection) = true;"
          else:
            - if:
                condition:
                  not:
                    api.connected:
                then:
                  - lambda: "id(api_connection) = false;"
  - interval: 10s
    then:
      - if:
          condition:
            - lambda: 'return { (id(wifi_connection) != true) };'
          then:
            - if:
                condition:
                  wifi.connected:
                then:
                  - lambda: "id(wifi_connection) = true;"
          else:
            - if:
                condition:
                  not:
                    wifi.connected:
                then:
                  - lambda: "id(wifi_connection) = false;"

select:
  - platform: template
    entity_category: config
    name: Wake word engine location
    id: wake_word_engine_location
    optimistic: true
    restore_value: true
    options:
      - In Home Assistant
      - On device
    initial_option: On device
    on_value:
      - if:
          condition:
            lambda: return x == "In Home Assistant";
          then:
            - micro_wake_word.stop
            - delay: 500ms
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:
            - text_sensor.template.publish:
                id: wakeword_location
                state: !lambda 'return "Home Assistant";'
            - component.update: s3_box_lcd
      - if:
          condition:
            lambda: return x == "On device";
          then:
            - text_sensor.template.publish:
                id: wakeword_location
                state: !lambda 'return "On Device";'
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop
            - delay: 500ms
            - micro_wake_word.start
            - component.update: s3_box_lcd

  - platform: template
    entity_category: config
    name: Time Format
    id: time_format
    optimistic: true
    restore_value: true
    options:
      - 12 Hr
      - 24 Hr
    initial_option: 24 Hr
    on_value:
      then:
        - if:
            condition:
              lambda: return x == "24 Hr";
            then:
              - text_sensor.template.publish:
                  id: time_display_format
                  state: !lambda 'return "24 Hr";'
            else:
              - text_sensor.template.publish:
                  id: time_display_format
                  state: !lambda 'return "12 Hr";'
        - component.update: s3_box_lcd

script:
  # ─── Chakra: send detection to HA light ──────────────────────
  - id: chakra_send_to_ha
    then:
      - lambda: |-
          const ChakraInfo& ci = ChakraAnalyser::get_info(id(chakra_index));
          id(chakra_ha_r) = (int)ci.r;
          id(chakra_ha_g) = (int)ci.g;
          id(chakra_ha_b) = (int)ci.b;
      - homeassistant.service:
          service: light.turn_on
          data:
            entity_id: light.${chakra_light_entity}
          data_template:
            brightness_pct: "{{ chakra_bri }}"
            rgb_color: "{{ [r, g, b] }}"
          variables:
            chakra_bri: !lambda 'return std::to_string(id(chakra_light_bri));'
            r: !lambda 'return std::to_string(id(chakra_ha_r));'
            g: !lambda 'return std::to_string(id(chakra_ha_g));'
            b: !lambda 'return std::to_string(id(chakra_ha_b));'
  # ─── End Chakra script ────────────────────────────────────────
  - id: start_voice_assistant
    then:
      - if:
          condition:
            and:
              - switch.is_off: mute_switch
              - lambda: return !id(chakra_mode_active);
          then:
            - if:
                condition:
                  lambda: return id(wake_word_engine_location).state == "In Home Assistant";
                then:
                  - lambda: id(va).set_use_wake_word(true);
                  - voice_assistant.start_continuous:
            - if:
                condition:
                  lambda: return id(wake_word_engine_location).state == "On device";
                then:
                  - lambda: id(va).set_use_wake_word(false);
                  - micro_wake_word.start

  - id: stop_voice_assistant
    then:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).state == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).state == "On device";
          then:
            - voice_assistant.stop:
            - micro_wake_word.stop:

  - id: set_volume
    then:
      - media_player.volume_set:
          volume: !lambda return 0.5 + id(speaker_volume) * 0.05 ;

  - id: saver_enabled
    then:
      - if:
          condition:
            switch.is_on: s_saver
          then:
            - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
            - delay: !lambda return id(s_saver_delay).state * 1000;
            - lambda: id(led).turn_on().set_brightness(id(s_saver_brightness).state /100).perform();
            - display.page.show: saver_page
            - component.update: s3_box_lcd
      - if:
          condition:
            - switch.is_on: s_saver_mode
          then:
            - delay: !lambda return id(s_saver_blank_delay).state * 1000;
            - light.turn_off: led
    mode: restart

  - id: saver_enabled_manual
    then:
      - if:
          condition:
            - switch.is_on: s_saver
          then:
            - lambda: id(led).turn_on().set_brightness(id(s_saver_brightness).state /100).perform();
            - display.page.show: saver_page
            - component.update: s3_box_lcd
      - if:
          condition:
            - switch.is_on: s_saver_mode
          then:
            - delay: !lambda return id(s_saver_blank_delay).state * 1000;
            - light.turn_off: led
            - component.update: s3_box_lcd
    mode: restart

  # - id: timer_started
    # then:
      # while:
        # condition:
          # switch.is_on: timer_ringing
        # then:
          # - voice_assistant.stop
          # - delay: 150ms
          # - media_player.speaker.play_on_device_media_file:
              # media_file: wake_sound_file
              # announcement: true
          # - delay: 1s

  - id: timer_started_external
    then:
      while:
        condition:
          switch.is_on: timer_ringing
        then:
          - homeassistant.service:
              service: media_player.play_media
              data:
                entity_id: media_player.${external_media_player}
                media_content_id: '${home_assistant_host}/local/sounds/timer_finished.mp3'
                media_content_type: music
          - delay: 1700ms

  - id: timer_ending
    then:
      - wait_until:
          - lambda: return (id(time_remaining_0).state == "0:00:10");
      - script.execute: saver_enabled
      - display.page.show: idle_page
      - component.update: s3_box_lcd


  - id: show_notification
    then:
      - lambda: id(led).turn_on().set_brightness(id(s_default_brightness).state /100).perform();
      - display.page.show: notification_page
      - component.update: s3_box_lcd
      - delay: 10s
      - display.page.show: idle_page
      - script.execute: saver_enabled
      - component.update: s3_box_lcd
